
name: Build Auvix Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AuvixMusicAndroid_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AuvixMusicAndroid_Project.zip -d project

      - name: Build debug APK
        run: |
          gradle -p project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AuvixMusic-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
